name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  contracts:
    name: Contracts Check & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: contracts -> contracts/target

      - name: Format Check
        run: cargo fmt --manifest-path contracts/Cargo.toml --check

      - name: Clippy
        run: cargo clippy --manifest-path contracts/Cargo.toml -- -D warnings

      - name: Build
        run: cargo build --manifest-path contracts/Cargo.toml --release

      - name: Test
        run: cargo test --manifest-path contracts/Cargo.toml

  web:
    name: Web App Lint, Typecheck & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter @blutoken/database build

      - name: Typecheck
        run: pnpm -r run typecheck

      - name: Lint
        run: pnpm -r run lint

      - name: Build
        run: pnpm --filter @blutoken/web build

  worker:
    name: MRV Worker Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r services/mrv-worker/requirements.txt

      - name: Syntax & Import Check
        run: |
          python -m compileall services/mrv-worker/app
