[workspace]
resolver = "2"
members = [
    "app",
    "client",
    "tests",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["BluToken Team"]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
sails-rs = { version = "0.6.3", default-features = false }
sails-idl-gen = { version = "0.6.3" }
parity-scale-codec = { version = "3.7.5", default-features = false, features = ["derive"] }
scale-info = { version = "2.11.6", default-features = false, features = ["derive"] }
blutoken-app = { path = "app" }
blutoken-client = { path = "client" }
